name: Build Lite (Windows)

# 在 GitHub 的 Windows 机器上自动编译安装包，本地和服务器都不用装任何东西。
# 用法：推到自己的仓库 → Actions → 左侧 Build Lite (Windows) → Run workflow
# 跑完在该次运行的 Artifacts 里下载 zip（里面有 exe 安装包）。

on:
  workflow_dispatch:
  push:
    tags:
      - 'lite-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      # 项目本身只有 cargo 侧的 tauri-cli 依赖，这里装预编译的 npm 版 CLI，
      # 比 cargo install 快，版本也能对齐 ^2。
      - name: Install Tauri CLI
        run: npm install --no-save --no-audit --no-fund @tauri-apps/cli@^2

      - name: Build
        run: npx tauri build --ci

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe -ErrorAction SilentlyContinue |
            Copy-Item -Destination out
          if (Test-Path src-tauri/target/release/EchoBird.exe) {
            Copy-Item src-tauri/target/release/EchoBird.exe out/EchoBird-portable.exe
          }
          Get-ChildItem out | Format-Table Name, Length

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: echobird-lite-windows-x64
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release (tag only)
        if: startsWith(github.ref, 'refs/tags/lite-v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
